
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Summary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <div class="imagem">
            <img src="images/illustration-hero.svg" alt="Ilustração de uma pessoa ouvindo música">
        </div>

        <div class="conteudo">

            <h1>Order Summary</h1>

            <p class="descricao">
                You can now listen to millions of songs,
                audiobooks, and podcasts on any device
                anywhere you like!
            </p>

            <div class="plano">

                <div class="icone">♫</div>

                <div class="informacoes">
                    <h3>Annual Plan</h3>
                    <p>$59.99/year</p>
                </div>

                <a href="#">Change</a>

            </div>

            <button class="pagamento">Proceed to Payment</button>

            <a href="#" class="cancelar">Cancel Order</a>

        </div>

    </main>

</body>
</html>
